name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: shell · compose · config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n scripts/bootstrap-vps.sh scripts/deploy-vps.sh scripts/backup-mail.sh scripts/check-health.sh scripts/restore-test.sh
          bash -n tests/backup/test-backup.sh tests/backup/restore-e2e.sh
          sh -n scripts/sync-release.sh

      - name: Test release sync
        run: |
          set -euo pipefail
          release=$(mktemp -d) app=$(mktemp -d) state=$(mktemp -d)
          git archive HEAD | tar -x -C "$release"
          sh scripts/sync-release.sh "$release" "$app" "$state"
          # runtime state that a deploy must keep
          mkdir -p "$app/data/conf/postfix/sql"
          echo generated > "$app/data/conf/postfix/sql/runtime.cf"
          echo edited > "$app/data/conf/rspamd/custom/ip_wl.map"
          rm "$release/README.md"
          sh scripts/sync-release.sh "$release" "$app" "$state"
          test ! -e "$app/README.md"
          test ! -e "$app/.env"
          grep -qx generated "$app/data/conf/postfix/sql/runtime.cf"
          grep -qx edited "$app/data/conf/rspamd/custom/ip_wl.map"
          test "$(cat "$state/release-changes")" = README.md

      - name: Test nightly backups
        run: bash tests/backup/test-backup.sh

      - name: Test the deploy health check and rollback
        run: bash tests/deploy/test-deploy.sh

      - name: Validate Docker Compose file
        run: docker compose config >/dev/null
        env:
          MAILCOW_HOSTNAME: mail.rabbittech.com.np
          TZ: Asia/Kathmandu
          COMPOSE_PROJECT_NAME: rabbittechmail
          DBPASS: ci-db-pass
          DBROOT: ci-db-root
          REDISPASS: ci-redis-pass
          HTTP_PORT: "80"
          HTTPS_PORT: "443"
          SMTP_PORT: "25"
          SMTPS_PORT: "465"
          SUBMISSION_PORT: "587"
          IMAP_PORT: "143"
          IMAPS_PORT: "993"
          POP_PORT: "110"
          POPS_PORT: "995"
          SIEVE_PORT: "4190"
          SKIP_LETS_ENCRYPT: "y"
          ENABLE_IPV6: "false"

      - name: Confirm RabbitTech assets exist
        run: |
          test -f data/web/img/rabbittech_mailcow.svg
          grep -q "RabbitTech Mail" data/web/img/rabbittech_mailcow.svg
          grep -q "RabbitTech Mail design system" data/web/css/build/016-rabbittech.css
          test -f data/web/templates/rabbittech/brand.twig
          test -f data/web/templates/rabbittech/nav.twig
          test -f data/web/templates/rabbittech/auth-hero.twig
          test -f data/web/templates/rabbittech/security-settings.twig
          test -f data/web/templates/rabbittech/summary-mailbox.twig
          test -f data/web/templates/rabbittech/summary-domain.twig
          test -f data/web/fonts/inter-latin-wght-normal.woff2
          test -f data/web/img/rabbittech_webmail.svg
          test -f data/web/img/rabbittech_webmail_dark.svg
          grep -q "rabbittech-sogo" data/conf/sogo/custom-sogo.js

      - name: Check UI JavaScript syntax
        run: |
          node --check data/web/js/build/013-mailcow.js
          node --check data/web/js/build/014-rabbittech.js
          node --check data/web/js/site/dashboard.js
          node --check data/web/js/site/mailbox.js
          node --check data/conf/sogo/custom-theme.js
          node --check data/conf/sogo/custom-sogo.js

      - name: Parse Twig templates
        run: php scripts/check-twig-templates.php

      - name: Check RabbitTech UI strings
        run: php scripts/check-rabbittech-lang.php

      - name: Test the Overview checks
        run: php tests/php/overview-checks.php

  ui:
    name: UI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install Playwright
        working-directory: tests/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare the webmail mock
        run: bash tests/ui/sogo/prepare.sh

      - name: Run UI smoke tests
        working-directory: tests/ui
        run: node smoke.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/ui/output
          if-no-files-found: ignore

  restore:
    name: Restore test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The images the server runs (docker-compose.yml) and mailcow's backup image
      - name: Pull images
        run: |
          for service in mysql-mailcow redis-mailcow dovecot-mailcow; do
            docker pull "$(awk -v s="$service:" '$1 == s { found = 1; next } found && $1 == "image:" { print $2; exit }' docker-compose.yml)"
          done
          docker pull "$(sed -n 's/^DEBIAN_DOCKER_IMAGE="\(.*\)"/\1/p' helper-scripts/backup_and_restore.sh)"

      - name: Restore a backup made like mailcow's, and broken copies of it
        run: bash tests/backup/restore-e2e.sh
